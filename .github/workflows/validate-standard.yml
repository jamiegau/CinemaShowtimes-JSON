name: Validate standard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate JSON examples
        run: python tools/validate_examples.py
      - name: Validate OpenAPI profile
        run: npx --yes @redocly/cli@2.43.2 lint openapi/cinemashowtimes-api-1.1.yaml
