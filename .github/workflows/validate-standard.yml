name: Validate standard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Validate JSON examples
        run: python tools/validate_examples.py
      - name: Test motion-poster contract
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check PHP syntax
        run: find conversion-tools wordpress-plugin tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Generate converter fixtures
        run: |
          mkdir -p "$RUNNER_TEMP/converter-fixtures"
          php tests/php/generate-converter-fixtures.php "$RUNNER_TEMP/converter-fixtures"
          php tests/php/wordpress-roundtrip.php "$RUNNER_TEMP/converter-fixtures/wordpress-1.1.json"
      - name: Validate converted 1.1 feeds
        run: |
          python tools/validate_examples.py \
            --feed "$RUNNER_TEMP/converter-fixtures/veezi-1.1.json" \
            --feed "$RUNNER_TEMP/converter-fixtures/venuemaster-1.1.json" \
            --feed "$RUNNER_TEMP/converter-fixtures/vista-1.1.json" \
            --feed "$RUNNER_TEMP/converter-fixtures/wordpress-1.1.json"
      - name: Validate OpenAPI profile
        run: npx --yes @redocly/cli@2.43.2 lint openapi/cinemashowtimes-api-1.1.yaml
